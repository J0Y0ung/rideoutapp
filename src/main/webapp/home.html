<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>R!DE OUT • 홈</title>
<link rel="stylesheet" href="ui.css">
</head>

<body>
<div class="app">

  <!-- ===== 상단 헤더 ===== -->
<header>
  <img src="images/logo.png" class="logo-img-left">
  <div class="logo-title">R!DE OUT</div>
  <div id="userInfo" class="user-info">
    <img id="userImg"><span id="userName"></span>
  </div>
  <div id="userMenu" class="user-menu">
    <button id="changeProfileBtn">🖼️ 프로필 변경</button>
    <button id="settingsBtn">⚙️ 설정</button>
    <button id="logoutBtn">🚪 로그아웃</button>
  </div>
</header>


  <!-- ===== 메인 콘텐츠 ===== -->
  <main id="content">
    <section class="app-icon-grid">
      <div class="app-icon" onclick="openPage('beat.html')"><i>🎧</i><span>비트 추천</span></div>
      <div class="app-icon" onclick="openPage('rhyme.html')"><i>✍️</i><span>라임 추천</span></div>
      <div class="app-icon" onclick="openPage('alarm.html')"><i>⏰</i><span>비트 알람</span></div>
      <div class="app-icon" onclick="openPage('health.html')"><i>💪</i><span>건강 관리</span></div>
      <div class="app-icon" onclick="openPage('ai.html')"><i>🤖</i><span>성장하는 AI</span></div>
    </section>
  </main>

  <!-- ===== 하단 탭바 ===== -->
  <footer>
    <div class="tab-btn" id="homeBtn" title="Home"></div>
  </footer>
</div>

<!-- ===== 숨겨진 파일 입력창 ===== -->
<input type="file" id="profileInput" accept="image/*" style="display:none;">

<!-- ===== 자바스크립트 ===== -->
<script src="ui.js"></script>

<script>
/* ✅ 페이지 이동 */
function openPage(page) {
  window.location.href = page;
}

/* ✅ 로그인된 사용자 정보 불러오기 */
window.onload = () => {
  const user = JSON.parse(localStorage.getItem("rideout_user"));
  const userInfo = document.getElementById("userInfo");
  if (user) {
    document.getElementById("userName").textContent = user.name || "USER";
    document.getElementById("userImg").src = user.picture || "images/defaultProfile.png";
    userInfo.style.display = "flex";
  } else {
    userInfo.style.display = "none";
  }
};

/* ✅ 메뉴 애니메이션 */
const menu = document.getElementById("userMenu");
const userInfo = document.getElementById("userInfo");

userInfo.addEventListener("click", () => {
  if (menu.classList.contains("show")) {
    menu.classList.remove("show");
    setTimeout(() => (menu.style.display = "none"), 200);
  } else {
    menu.style.display = "flex";
    setTimeout(() => menu.classList.add("show"), 10);
  }
});

window.addEventListener("click", (e) => {
  if (!menu.contains(e.target) && !userInfo.contains(e.target)) {
    menu.classList.remove("show");
    setTimeout(() => (menu.style.display = "none"), 200);
  }
});

/* ✅ 프로필 변경 (파일 업로드) */
const profileInput = document.getElementById("profileInput");
document.getElementById("changeProfileBtn").addEventListener("click", () => {
  profileInput.click(); // 파일 선택창 열기
});

profileInput.addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById("userImg").src = e.target.result;
      const user = JSON.parse(localStorage.getItem("rideout_user")) || {};
      user.picture = e.target.result; // base64 저장
      localStorage.setItem("rideout_user", JSON.stringify(user));
    };
    reader.readAsDataURL(file); // 이미지 파일을 base64로 변환
  }
});

/* ✅ 설정 버튼 */
document.getElementById("settingsBtn").addEventListener("click", () => {
  location.href = "settings.html";
});


/* ✅ 로그아웃 버튼 */
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("rideout_user");
  document.getElementById("userMenu").classList.remove("show");
  setTimeout(() => (document.getElementById("userMenu").style.display = "none"), 200);
  alert("로그아웃 되었습니다.");
  location.reload();
});
</script>
</body>
</html>
