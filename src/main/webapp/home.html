<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>R!DE OUT • 홈</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app">
 <header>
  <div class="logo">
    <img src="images/logo.png" alt="logo" class="logo-img">
    <span>R!DE OUT</span>
  </div>

  <div id="userInfo" class="user-info" style="display:none;">
    <img id="userImg" src=""><span id="userName"></span>
  </div>
  <div id="logoutPopup" class="logout-popup">
    <button id="logoutBtn">🚪 로그아웃</button>
  </div>
</header>

  <main id="content">
    <section class="app-icon-grid">

      <div class="app-icon" onclick="openPage('beat.html')">
        <div class="app-icon-box"><i>🎧</i></div>
        <span>비트 추천</span>
      </div>

      <div class="app-icon" onclick="openPage('rhyme.html')">
        <div class="app-icon-box"><i>✍️</i></div>
        <span>라임 추천</span>
      </div>

      <div class="app-icon" onclick="openPage('alarm.html')">
        <div class="app-icon-box"><i>⏰</i></div>
        <span>비트 알람</span>
      </div>

      <div class="app-icon" onclick="openPage('health.html')">
        <div class="app-icon-box"><i>💪</i></div>
        <span>건강 관리</span>
      </div>

      <div class="app-icon" onclick="openPage('ai.html')">
        <div class="app-icon-box"><i>🤖</i></div>
        <span>성장하는 AI</span>
      </div>

    </section>
  </main>

  <footer>
    <div class="tab-btn" id="homeBtn" title="Home"></div>
  </footer>
</div>

<script src="ui.js"></script>
<script>injectChrome('홈');</script>
</body>
</html>
