<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>일정 등록</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <img src="images/logo.png" class="logo-img"><span>R!DE OUT · 일정 등록</span>
    </div>
    <div id="userInfo" class="user-info" style="display:none;">
      <img id="userImg" src="images/defaultProfile.png"><span id="userName">USER</span>
    </div>
  </header>

  <main id="content">
    <div class="section-title">일정 등록</div>
    <div class="section-sub">간단히 적고 ▶ 버튼으로 전송하세요</div>

    <div class="input-row">
      <input id="title" placeholder="예: 16:00 믹싱 세션 / 19:30 공연 리허설">
      <button class="play-btn" onclick="save()">▶</button>
    </div>

    <div class="list" id="recent"></div>
  </main>

  <footer><div class="tab-btn" onclick="location.href='schedule.html'"></div></footer>
</div>

<script>
const KEY='RIDEOUT_SCHEDULES';
function read(){ return JSON.parse(localStorage.getItem(KEY)||'[]'); }
function write(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }

function save(){
  const v=document.getElementById('title').value.trim();
  if(!v){ alert('일정을 입력하세요.'); return; }
  const item={ id:Date.now(), text:v, createdAt:new Date().toISOString() };
  const arr=read(); arr.unshift(item); write(arr);
  document.getElementById('title').value='';
  render();
}
function render(){
  const arr=read().slice(0,5);
  const box=document.getElementById('recent');
  box.innerHTML = arr.map(it=>`
    <div class="item">
      <div>${it.text}</div>
      <div class="meta">${new Date(it.createdAt).toLocaleString()}</div>
    </div>`).join('') || '<div class="meta">최근 등록이 없습니다.</div>';
}
render();
</script>
</body>
</html>
