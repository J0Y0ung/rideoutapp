<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>R!DE OUT • 로그인</title>
<link rel="stylesheet" href="ui.css">
<style>
.login-page{
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Roboto;
}
.login-box{
  border:1px solid #555;padding:20px 30px;border-radius:15px;background:#111;
  text-align:center;box-shadow:0 0 20px rgba(0,0,0,.6);
}
.login-box h1{margin-bottom:20px;font-size:1.4rem;}
.login-box input{
  width:100%;margin-bottom:10px;padding:10px;border-radius:8px;border:none;
  background:#222;color:#fff;text-align:center;
}
.login-box button{
  width:100%;padding:10px;border:none;border-radius:8px;
  background:#8a7cff;color:#fff;font-weight:700;cursor:pointer;
}
.login-box button:hover{background:#a799ff;}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <h1>🔥 R!DE OUT</h1>
    <input type="text" id="username" placeholder="사용자 이름 입력">
    <input type="text" id="profile" placeholder="프로필 이미지 URL (선택)">
    <button onclick="fakeLogin()">로그인</button>
  </div>
</div>

<script>
function fakeLogin(){
  const name=document.getElementById('username').value.trim();
  if(!name){alert('이름을 입력하세요!');return;}
  const picture=document.getElementById('profile').value.trim()||'https://cdn-icons-png.flaticon.com/512/149/149071.png';
  localStorage.setItem('rideout_user',JSON.stringify({name,picture}));
  window.location.href='main.html';
}
</script>
</body>
</html>
